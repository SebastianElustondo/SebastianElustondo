<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Now: open to remote full-time roles. Argentina, GMT-3, full overlap with US hours.">
  
  <defs>
