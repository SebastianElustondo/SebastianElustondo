<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="Stack: what the building is made of">
  
  <defs>
    <linearGradient id="pdstack-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0E22"/><stop offset=".62" stop-color="#1D1A40"/><stop offset="1" stop-color="#3E2C3C"/>
    </linearGradient>
    <linearGradient id="pdstack-plaster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B2637"/><stop offset="1" stop-color="#241F30"/>
    </linearGradient>
    <filter id="pdstack-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="pdstack-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="1" y="10" width="148" height="44" rx="4" fill="url(#pdstack-plaster)" stroke="#181423" stroke-width="2"/>
  <circle cx="14" cy="32" r="2" fill="#3A3348"/><circle cx="136" cy="32" r="2" fill="#3A3348"/>
  <text x="28" y="39" font-family="'Azeret Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#AEA6BE" letter-spacing=".5">3º</text>
  <text x="60" y="40" font-family="'Young Serif', Georgia, 'Times New Roman', serif" font-size="24" fill="#F1E9DC">Stack</text>
  <line x1="164" y1="32" x2="996" y2="32" stroke="#3A3348" stroke-width="2" opacity=".8"/>
  <text x="996" y="22" text-anchor="end" font-family="'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#AEA6BE">what the building is made of</text>
</svg>
