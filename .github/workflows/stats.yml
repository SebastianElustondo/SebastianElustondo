name: stats

# Redraws assets/stats-{dark,light}.svg (the contributions building on the profile README).
# Needs the STATS_TOKEN secret: a personal access token with `repo` + `read:user`, so private
# contributions and private-repo languages count. Without it the job exits without touching
# anything, so the committed card never regresses to public-only numbers.

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (06:17 Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redraw the stats card
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "STATS_TOKEN not set: skipping (add a PAT with repo + read:user as a repo secret)"
            exit 0
          fi
          python3 scripts/stats.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "stats: refresh contributions card"
          git push
