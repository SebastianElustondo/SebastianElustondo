  <text x="500" y="104" text-anchor="middle" font-family="'Azeret Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#7A4E14" letter-spacing=".6">ARGENTINA · GMT-3 · FULL OVERLAP WITH US HOURS</text>
  <circle cx="60" cy="138" r="1.6" fill="#9E958A"/><circle cx="940" cy="138" r="1.6" fill="#9E958A"/>
