<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-label="Live: five lit windows, one per product">
  
  <defs>
    <linearGradient id="pllive-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA8DC"/><stop offset=".62" stop-color="#BDD6EA"/><stop offset="1" stop-color="#E6ECF0"/>
    </linearGradient>
    <linearGradient id="pllive-plaster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCD2C4"/><stop offset="1" stop-color="#C6BAAA"/>
    </linearGradient>
    <filter id="pllive-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="pllive-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="1" y="10" width="134" height="44" rx="4" fill="url(#pllive-plaster)" stroke="#9E9081" stroke-width="2"/>
  <circle cx="14" cy="32" r="2" fill="#B3A697"/><circle cx="122" cy="32" r="2" fill="#B3A697"/>
  <text x="28" y="39" font-family="'Azeret Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5C5468" letter-spacing=".5">6º</text>
  <text x="60" y="40" font-family="'Young Serif', Georgia, 'Times New Roman', serif" font-size="24" fill="#1E1A2A">Live</text>
  <line x1="150" y1="32" x2="996" y2="32" stroke="#B3A697" stroke-width="2" opacity=".8"/>
  <text x="996" y="22" text-anchor="end" font-family="'Atkinson Hyperlegible', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#5C5468">five lit windows, one per product</text>
</svg>
